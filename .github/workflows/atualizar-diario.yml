# Atualiza os dados do SARtellite todo dia e publica o site no GitHub Pages.
#
# O que roda: o pipeline inteiro de Rondônia (NISAR, focos do FIRMS, chuva da Meteomatics,
# Sentinel-1 e Sentinel-2), depois os testes, o build e a publicação.
#
# Para ligar (uma vez só):
#   1. Este arquivo precisa estar na branch principal (main): o GitHub só roda agendamentos de lá.
#   2. Settings > Pages > Source: "GitHub Actions".
#   3. Settings > Secrets and variables > Actions > New repository secret:
#        FIRMS_MAP_KEY          chave gratuita do NASA FIRMS (https://firms.modaps.eosdis.nasa.gov/api/map_key/)
#        METEOMATICS_USERNAME   usuário da Meteomatics
#        METEOMATICS_PASSWORD   senha da Meteomatics
#      As senhas ficam só nos Secrets. Nunca vão para o código nem para o site.
name: Atualizar dados e publicar

on:
  schedule:
    - cron: "23 11 * * *" # todo dia às 07h23 de Rondônia (11h23 UTC), depois da passagem do NISAR (~10h UTC)
  workflow_dispatch: # botão "Run workflow" para rodar na hora
  push:
    branches: [main]
    paths: ["src/**", "public/**", "index.html", "package.json", "vite.config.ts"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # O que já foi baixado (prévias NISAR, séries do Sentinel-1) fica guardado: cada dia só busca o que é novo.
      - name: Recuperar downloads anteriores
        uses: actions/cache@v4
        with:
          path: pipeline/cache
          key: pipeline-cache-${{ github.run_id }}
          restore-keys: pipeline-cache-

      - name: Atualizar dados (pipeline de Rondônia)
        id: dados
        if: github.event_name != 'push'
        continue-on-error: true # se uma fonte estiver fora do ar, o site continua no ar com os dados de ontem
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          METEOMATICS_USERNAME: ${{ secrets.METEOMATICS_USERNAME }}
          METEOMATICS_PASSWORD: ${{ secrets.METEOMATICS_PASSWORD }}
        run: |
          pip install -r pipeline/requirements.txt
          bash pipeline/rondonia/run_all.sh

      - name: Desfazer dados pela metade se o pipeline falhou
        if: steps.dados.outcome == 'failure'
        run: git checkout -- public/data && git clean -fd public/data

      - name: Testar e montar o site
        run: |
          npm ci
          npm test
          npm run build

      - name: Guardar os dados novos no repositório
        if: steps.dados.outcome == 'success'
        run: |
          git config user.name "sartellite-bot"
          git config user.email "sartellite-bot@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "Dados atualizados em $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
